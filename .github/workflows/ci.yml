name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run Gradle check (Spotless, Error Prone + NullAway, Levels 1-3, JEP 458, Scenarios, Demo Freshness)
        run: gradle check --stacktrace

      - name: Verify CLI launcher shim (POSIX)
        if: runner.os != 'Windows'
        run: ./procomp --help

      - name: Verify CLI launcher shim (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: procomp.cmd --help

  outer-loop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run real-OS topology E2E suite
        run: gradle :e2e:runner:e2eTest --stacktrace

      - name: Install Playwright Chromium & run Web UI E2E suite
        run: gradle :e2e:web-ui:installBrowsers :e2e:web-ui:uiE2eTest --stacktrace
