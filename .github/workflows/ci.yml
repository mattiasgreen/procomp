name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run full test suite (Levels 1, 2, 3)
        run: java test/TestRunner.java

      - name: Verify CLI launcher shim (POSIX)
        if: runner.os != 'Windows'
        run: ./procomp --help

      - name: Verify CLI launcher shim (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: procomp.cmd --help
