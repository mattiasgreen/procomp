name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile MockService JAR
        shell: cmd
        run: |
          cd mock-service
          javac MockService.java
          jar cfe mock-service.jar MockService MockService.class

      - name: Run Pester Unit & Real-JVM Integration Tests
        shell: cmd
        run: test.cmd

      - name: Run Doctor Preflight
        shell: cmd
        run: procomp.cmd -Action doctor
